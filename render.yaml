services:
  # Backend API
  - type: web
    name: travelerai-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.12"
      - key: CORS_ORIGINS
        sync: false  # Set manually after frontend deploys
      # Add all API keys as secrets in Render dashboard:
      # - OPENROUTER_API_KEY or ANTHROPIC_API_KEY
      # - SERPER_API_KEY
      # - TAVILY_API_KEY
      # - GOOGLE_MAPS_API_KEY

  # Frontend (Web Service for Next.js SSR support)
  - type: web
    name: travelerai-web
    runtime: node
    rootDir: web
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_URL
        sync: false  # Set manually after backend deploys
